name: Deploy Sunfest

# Deploys sunfest2027, the active Furry Colombia site, to its Cloudflare Worker,
# retrieving the Cloudflare token from the repository secret at run time.
# Runs on every merge to main that touches the site, and on demand.
on:
  push:
    branches: [main]
    paths:
      - "apps/sunfest2027/**"
      - "cloudflare/sunfest-worker.mjs"
      - "wrangler.sunfest.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-sunfest.yml"
  workflow_dispatch:

# One deploy at a time; a newer merge replaces a deploy still waiting to start.
concurrency:
  group: deploy-sunfest
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build sunfest site
        run: pnpm --filter sunfest2027 build

      # Names only, never values: when the token is missing, show which secrets
      # and environments this job can see so the right one can be wired in.
      - name: Check the Cloudflare token is available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is set."
            exit 0
          fi
          echo "Secrets visible to this job:"
          printf '%s' "$ALL_SECRETS" | jq -r 'keys[]'
          echo "Environments in this repo:"
          gh api "repos/$GITHUB_REPOSITORY/environments" --jq '.environments[].name' || true
          echo "::error::CLOUDFLARE_API_TOKEN is empty for this job."
          exit 1

      - name: Deploy to Cloudflare (token from secret)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --config wrangler.sunfest.toml
